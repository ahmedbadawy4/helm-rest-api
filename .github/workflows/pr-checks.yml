name: PR Checks

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  helm-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      # The workflows publish ghcr.io/<owner>/<repository>. A repository rename
      # does not rename the package, so the image name in the chart values has
      # to follow the repository name.
      - name: Image name matches the repository
        run: |
          expected="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          failed=0
          for f in values.yaml values-dev.yml values-prod.yml; do
            path="charts/helm-rest-api/$f"
            actual="$(awk '$1 == "repository:" { gsub(/"/, "", $2); print $2; exit }' "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error file=$path::image.repository is '$actual', expected '$expected'"
              failed=1
            fi
          done
          exit "$failed"

      - name: Helm lint (default, dev and prod values)
        run: |
          helm lint ./charts/helm-rest-api
          helm lint ./charts/helm-rest-api -f ./charts/helm-rest-api/values-dev.yml
          helm lint ./charts/helm-rest-api -f ./charts/helm-rest-api/values-prod.yml

      - name: Helm template (dev)
        run: helm template helm-rest-api-dev ./charts/helm-rest-api -f ./charts/helm-rest-api/values-dev.yml >/dev/null

      - name: Helm template (prod)
        run: helm template helm-rest-api-prod ./charts/helm-rest-api -f ./charts/helm-rest-api/values-prod.yml >/dev/null

      - name: Kubeconform (dev render)
        run: |
          helm template helm-rest-api-dev ./charts/helm-rest-api -f ./charts/helm-rest-api/values-dev.yml \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -ignore-missing-schemas

      - name: Kubeconform (prod render)
        run: |
          helm template helm-rest-api-prod ./charts/helm-rest-api -f ./charts/helm-rest-api/values-prod.yml \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -ignore-missing-schemas

  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  trivy-fs-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  build-and-scan-image:
    runs-on: ubuntu-latest
    needs: [dockerfile-lint, trivy-fs-scan]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: local/helm-rest-api:${{ github.sha }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: local/helm-rest-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
